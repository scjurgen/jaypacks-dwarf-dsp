[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lua-editor"
version = "0.1.0"
description = "Editor for the Lua scripts of the jaypacks Dwarf plugins"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "lupa>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
lua-editor = "lua_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
